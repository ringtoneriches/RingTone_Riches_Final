<!DOCTYPE html>
<html>
<head>
    <style type="text/css">
        body {
            background-image: url("png/Background_2.png");
            background-color: #0d0005;
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            padding: 0px;
            margin: 0px;
            overflow: hidden;
        }
        canvas {
            display: block;
            margin: 0;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
    </style>
    <script src="js/phaser.js"></script>
</head>
<body>
    <script src="js/slotConfigRoyalReels.js?v=royal-symbols2"></script>
    <script src="js/mkutils.js"></script>
    <script src="js/popups.js"></script>
    <script src="js/state_machine.js"></script>
    <script src="js/slot_classes.js"></script>
    <script src="js/slotGame.js?v=royal-symbols2"></script>
    <script>
        (function() {
            var _orig = SlotGame.prototype.loadSceneConfig;
            SlotGame.prototype.loadSceneConfig = function() {
                slotConfig = slotConfigRoyalReels;
                try {
                    var params = new URLSearchParams(window.location.search);
                    var credits = parseInt(params.get('credits') || '0');
                    if (credits > 0) slotConfig.defaultCoins = credits;
                } catch (e) {}
            };
        })();

        (function() {
            var params = new URLSearchParams(window.location.search);
            var controlledRoyal = params.get('controlled') === '1';
            if (!controlledRoyal) return;

            var serverPayload = null;
            var waitingForServer = false;

            window.addEventListener('message', function(event) {
                if (!event.data || event.data.type !== 'royalControlledSpin') return;
                serverPayload = event.data;
                waitingForServer = false;
                if (window.slotGame && typeof window.slotGame.runSlot === 'function') {
                    window.slotGame.runSlot();
                }
            });

            window.postRoyalSpinResult = function(isWin, coinsWon, balance) {
                if (!window.parent || window.parent === window) return;
                var payload = serverPayload;
                window.parent.postMessage({
                    type: 'slotSpinResult',
                    isWin: payload ? !!payload.isWin : !!isWin,
                    coinsWon: payload ? Number(payload.coinsWon || 0) : Number(coinsWon || 0),
                    balance: balance,
                    controlledPool: true,
                }, '*');
                serverPayload = null;
                if (slotConfig) slotConfig.reels_simulate = null;
            };

            var _origRunSlot = SlotGame.prototype.runSlot;
            SlotGame.prototype.runSlot = function() {
                if (serverPayload) {
                    slotConfig.reels_simulate = slotConfigRoyalReels.reelStopsFromOutcome(
                        serverPayload.isWin,
                        serverPayload.winSymbol,
                        serverPayload.reelStops
                    );
                    return _origRunSlot.call(this);
                }
                if (waitingForServer) return;
                waitingForServer = true;
                if (window.parent && window.parent !== window) {
                    window.parent.postMessage({ type: 'royalSpinRequest' }, '*');
                }
            };
        })();
    </script>
</body>
</html>
